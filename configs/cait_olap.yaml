seed_everything: 42

model:
  class_path: clat.model.CLAT
  init_args:
    arch_name: cait_xs24_384_concept
    pretrained: true
    disease_loss_weight: 0.6
    lesion_loss_weight: 1.0
    KG_loss_weight: 0.4
    with_EK: true
    training_int_prob: null
    training_int_milestone: 999
    use_olap: true
    olap_initial_power: 3.0
    olap_ortho_weight: 0.02

optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 4e-5
    weight_decay: 1e-4

lr_scheduler:
  class_path: torch.optim.lr_scheduler.CosineAnnealingWarmRestarts
  init_args:
    T_0: 15
    T_mult: 2
    eta_min: 1e-6

trainer:
  devices: [0,]
  max_epochs: 100
  log_every_n_steps: 1
  logger:
    class_path: lightning.pytorch.loggers.TensorBoardLogger
    init_args:
      save_dir: log
      name: cait_olap
      version: 
      log_graph: false
      default_hp_metric: false
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/kappa
        mode: max
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/kappa
        mode: max
        patience: 20
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch
    - class_path: clat.callbacks.MetricsCaculator
      init_args:
        verbose: true
    - class_path: clat.olap.ConceptTransparencyMonitor
      init_args:
        verbose: true
    - class_path: clat.olap.LayerDataflowTracer
      init_args:
        trace_every_n_epochs: 1
    - class_path: clat.callbacks.GenHeatmap
